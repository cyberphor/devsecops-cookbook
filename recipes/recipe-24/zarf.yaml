# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: sonic
  version: v0.1.0
  annotations:
    dev.uds.title: Sonic
components:
  - name: sonic
    required: true
    manifests:
      - name: sonic
        namespace: sonic
        files:
          - uds-package.yaml
    charts:
      - name: sonic
        version: v0.1.0
        namespace: sonic
        localPath: charts/frontend
        valuesFiles:
          - charts/frontend/values.yaml
    images:
      - docker.io/dazdaz/sonic:latest

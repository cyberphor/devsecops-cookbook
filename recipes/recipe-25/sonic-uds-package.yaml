# sonic-uds-package.yaml

---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  namespace: sonic
  name: sonic
spec:
  network:
    expose:    
      - service: frontend
        selector:
          app.kubernetes.io/component: frontend
        host: sonic
        port: 8080
  sso:
    - name: Sonic
      clientId: sonic
      redirectUris:
        - https://sonic.uds.dev/login
      enableAuthserviceSelector:
        app.kubernetes.io/component: frontend
